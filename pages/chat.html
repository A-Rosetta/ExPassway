<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="chatPageTitle">ExPassway Chat</title>
  <script src="../scripts/theme-init.js?v=20260730-1"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/styles.css?v=20260729-2" />
  <link rel="stylesheet" href="../assets/site-design.css?v=20260806-2" />
</head>
<body class="student-ui site-ui chat-page">
  <header class="site-topbar chat-topbar">
    <div class="site-topbar__inner">
      <a class="home-brand" href="../index.html" aria-label="ExPassway">
        <span class="home-brand__mark" aria-hidden="true">E</span>
        <span data-i18n="homeBrand">ExPassway</span>
      </a>
      <div class="site-header-controls">
        <a class="site-header-command btn-secondary" href="../index.html" data-i18n="backBtn">Back</a>
        <button id="themeToggle" class="site-header-control home-theme-toggle" type="button" aria-label="Switch theme"></button>
      </div>
    </div>
  </header>

  <main class="chat-shell">
    <section class="chat-heading">
      <div>
        <p class="home-eyebrow" data-i18n="chatNavLabel">Chat</p>
        <h1 data-i18n="chatTitle">Friends and chat</h1>
        <p data-i18n="chatSubtitle">End-to-end encrypted direct messages.</p>
      </div>
      <p id="chatStatus" class="chat-status" role="status" aria-live="polite"></p>
    </section>

    <section id="chatDisabledPanel" class="chat-panel chat-panel--notice" hidden>
      <h2 data-i18n="chatDisabled">Chat is not enabled for this deployment yet.</h2>
    </section>

    <section id="chatSetupPanel" class="chat-panel chat-setup-panel" hidden>
      <h2 data-i18n="chatSetupTitle">Set up this device</h2>
      <p data-i18n="chatSetupDescription">Keys stay on this device.</p>
      <button id="generateDeviceKeys" class="btn-primary" type="button" data-i18n="chatSetupButton">Generate device keys</button>
    </section>

    <section id="chatApp" class="chat-layout" hidden>
      <aside class="chat-sidebar">
        <section class="chat-panel chat-invite-panel">
          <div class="chat-panel__heading">
            <h2 data-i18n="chatInvitesTitle">Friend invites</h2>
            <button id="createInvite" class="btn-primary chat-small-action" type="button" data-i18n="chatCreateInvite">Create invite link</button>
          </div>
          <label class="chat-invite-input">
            <span data-i18n="chatInviteLinkLabel">Invite token</span>
            <input id="inviteToken" type="text" data-i18n-placeholder="chatInvitePlaceholder" placeholder="Paste an invite token or link" />
          </label>
          <button id="acceptInvite" class="btn-secondary" type="button" data-i18n="chatAcceptInvite">Accept invite</button>
          <div id="inviteList" class="chat-invite-list"></div>
        </section>
        <section class="chat-panel">
          <div class="chat-panel__heading">
            <h2 data-i18n="chatConversationsTitle">Conversations</h2>
            <button id="refreshChat" class="btn-secondary chat-icon-action" type="button" aria-label="Refresh" title="Refresh">↻</button>
          </div>
          <div id="conversationList" class="chat-conversation-list" aria-live="polite"></div>
        </section>
        <section class="chat-panel chat-device-panel">
          <h2 data-i18n="chatDevices">Devices</h2>
          <p id="deviceFingerprint" class="chat-fingerprint"></p>
          <div id="deviceList" class="chat-device-list"></div>
        </section>
      </aside>

      <section class="chat-panel chat-conversation-panel">
        <div id="conversationEmpty" class="chat-empty-state">
          <p data-i18n="chatNoConversation">Choose a friend to start chatting.</p>
          <p class="chat-muted" data-i18n="chatComingLater">Group chat and calls will arrive later.</p>
        </div>
        <div id="conversationActive" hidden>
          <header class="chat-conversation-header">
            <div>
              <h2 id="conversationTitle"></h2>
              <p id="conversationSafety" class="chat-muted"></p>
            </div>
            <label class="chat-retention-control">
              <span data-i18n="chatRetention">Retention</span>
              <select id="retentionSelect">
                <option value="86400" data-i18n="chatRetention24h">24 hours</option>
                <option value="604800" data-i18n="chatRetention7d">7 days</option>
                <option value="2592000" data-i18n="chatRetention30d">30 days</option>
                <option value="0" data-i18n="chatRetentionForever">Keep long-term</option>
              </select>
            </label>
          </header>
          <div id="messageList" class="chat-message-list" aria-live="polite"></div>
          <form id="messageForm" class="chat-compose">
            <textarea id="messageInput" rows="2" data-i18n-placeholder="chatInputPlaceholder" placeholder="Write an encrypted message..." required></textarea>
            <div class="chat-compose__actions">
              <label class="chat-file-button" title="Encrypt image" data-i18n-title="chatAttachImage" aria-label="Encrypt image" data-i18n-aria-label="chatAttachImage">
                <span aria-hidden="true">+</span>
                <input id="imageInput" type="file" accept="image/*" hidden />
              </label>
              <button id="emojiButton" class="btn-secondary" type="button" data-i18n="chatEmoji">Emoji</button>
              <button id="sendMessage" class="btn-primary" type="submit" data-i18n="chatSend">Send</button>
            </div>
            <div id="emojiTray" class="chat-emoji-tray" hidden>
              <button type="button">🙂</button><button type="button">🎉</button><button type="button">💡</button><button type="button">✅</button><button type="button">❤️</button>
            </div>
          </form>
        </div>
      </section>
    </section>
  </main>

  <script src="../scripts/i18n.js?v=20260808-1"></script>
  <script src="../scripts/site-ui.js?v=20260806-1"></script>
  <script src="../scripts/api.js?v=20260808-1"></script>
  <script data-chat-notifications-loader="true" src="../scripts/chat-notifications.js?v=20260808-1"></script>
  <script src="../scripts/chat.js?v=20260808-1"></script>
</body>
</html>
