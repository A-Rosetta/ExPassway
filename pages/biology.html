<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="biologyPageTitle">IGCSE Biology 章节练习</title>
  <script src="../scripts/theme-init.js?v=20260730-1"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" />
  <link rel="stylesheet" href="../assets/styles.css?v=20260808-2" />
  <link rel="stylesheet" href="../assets/site-design.css?v=20260806-2" />
</head>
<body class="student-ui site-ui chapter-practice-page">
  <header class="chapter-topbar">
    <div class="chapter-topbar__inner">
      <a class="home-brand" href="../index.html">
        <span class="home-brand__mark" aria-hidden="true">E</span>
        <span data-i18n="homeBrand">ExPassway</span>
      </a>
      <div class="site-header-controls">
        <button id="backHome" class="btn-secondary" type="button" data-i18n="backHome">返回首页</button>
      </div>
    </div>
  </header>

  <main class="chapter-shell">
    <section class="chapter-heading">
      <div>
        <p class="home-eyebrow">Cambridge IGCSE · 0610</p>
        <h1 data-i18n="biologyChapterHeading">Biology</h1>
        <p id="curriculumVersion" class="tip"></p>
      </div>
      <div class="chapter-mode-switch" role="tablist" aria-label="练习模式" data-i18n-aria-label="biologyModeLabel">
        <button id="chapterMode" class="is-active" type="button" role="tab" aria-selected="true" data-i18n="chapterPracticeMode">章节练习</button>
        <button id="paperMode" type="button" role="tab" aria-selected="false" data-i18n="paperPracticeMode">真题套卷</button>
      </div>
    </section>

    <p id="chapterStatus" class="chapter-status" role="status"></p>
    <section id="chapterList" class="chapter-list" aria-live="polite"></section>

    <section id="practicePanel" class="chapter-practice-workspace" hidden>
      <div class="chapter-practice-toolbar">
        <div>
          <p id="practiceBreadcrumb" class="home-eyebrow"></p>
          <h2 id="practiceTitle"></h2>
        </div>
        <button id="closePractice" class="btn-secondary" type="button" data-i18n="backToChapters">返回章节</button>
      </div>
      <div id="questionProgress" class="chapter-question-progress"></div>
      <article id="chapterQuestion" class="chapter-question"></article>
      <div class="chapter-question-actions">
        <button id="previousQuestion" class="btn-secondary" type="button" data-i18n="previousQuestion">上一题</button>
        <button id="nextQuestion" class="btn-secondary" type="button" data-i18n="nextQuestion">下一题</button>
        <button id="submitChapterPractice" class="btn-primary" type="button" data-i18n="submitChapterPractice">提交练习</button>
      </div>
      <section id="chapterResult" class="chapter-result" hidden></section>
    </section>
  </main>

  <script src="../scripts/i18n.js?v=20260806-2"></script>
  <script src="../scripts/site-ui.js?v=20260808-3"></script>
  <script src="../scripts/api.js?v=20260729-1"></script>
  <script src="../scripts/pet.js?v=20260806-2"></script>
  <script src="../scripts/biology.js?v=20260806-1"></script>
</body>
</html>
