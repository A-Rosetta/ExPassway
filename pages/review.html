<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="reviewPageTitle">练习总结</title>
  <script src="../scripts/theme-init.js?v=20260730-1"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" />
  <link rel="stylesheet" href="../assets/styles.css?v=20260802-12" />
  <link rel="stylesheet" href="../assets/site-design.css?v=20260803-4" />
</head>
<body class="student-ui site-ui review-page">
  <main class="container">
    <section class="card hero">
      <h1 data-i18n="reviewHeroTitle">练习总结</h1>
      <p class="tip" data-i18n="reviewHeroSubtitle">总结页已调整为答题总览：左侧答案表，右侧正确率分布，下方保留逐题复盘。</p>
    </section>

    <section class="card panel">
      <h2 data-i18n="reviewScoreTitle">成绩概览</h2>
      <div id="reviewSummary"></div>
    </section>

    <section id="reviewQuestionSection" class="card panel">
      <h2 data-i18n="reviewWrongTitle">错题与星标题目</h2>
      <div id="reviewNavTop"></div>
      <div id="wrongQuestions"></div>
      <div id="reviewNavBottom"></div>
      <div class="actions">
        <button id="backGenerate" class="btn-secondary" data-i18n="backGenerate">返回出题页</button>
        <button id="goAnalysis" class="btn-primary" data-i18n="goToAnalysis">进入错题分析页</button>
      </div>
    </section>
  </main>

  <script src="../scripts/i18n.js?v=20260729-4"></script>
  <script src="../scripts/site-ui.js?v=20260730-1"></script>
  <script src="../scripts/api.js?v=20260729-1"></script>
  <script src="../scripts/pet.js?v=20260731-1"></script>
  <script src="../scripts/review.js?v=20260718-1"></script>
</body>
</html>
