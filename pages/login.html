<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="loginPageTitle">Log in or sign up</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/styles.css?v=20260802-3" />
</head>
<body class="student-ui auth-page">
  <main class="auth-layout">
    <section class="auth-box" aria-labelledby="loginTitle">
      <a class="auth-brand" href="../index.html" data-i18n="homeBrand">ExPassway</a>

      <div class="auth-heading">
        <h1 id="loginTitle" data-i18n="loginHeroTitle">Log in or sign up</h1>
        <p data-i18n="loginHeroSubtitle">Practice smarter for the grades that open doors to leading universities.</p>
      </div>

      <div id="emailStep" class="auth-step">
        <button id="googleLoginBtn" class="auth-provider-button" type="button">
          <img src="../assets/google-g.svg" alt="" width="20" height="20" />
          <span data-i18n="continueWithGoogle">Continue with Google</span>
        </button>

        <div class="auth-divider" data-i18n="orDivider">OR</div>

        <form id="emailOtpRequestForm" novalidate>
          <label class="sr-only" for="emailOtpAddress" data-i18n="emailAddressLabel">Email address</label>
          <input id="emailOtpAddress" class="auth-input" type="email" autocomplete="email" maxlength="254" required data-i18n-placeholder="emailAddressPlaceholder" placeholder="Email address" />
          <p id="emailOtpAddressError" class="auth-field-error" role="alert" hidden></p>
          <button id="emailOtpRequestBtn" class="auth-submit-button" type="submit" data-i18n="continueWithEmail">Continue with email</button>
        </form>
      </div>

      <div id="otpStep" class="auth-step" hidden>
        <p id="otpAccountEmail" class="auth-account-email"></p>
        <form id="emailOtpVerifyForm" novalidate>
          <label class="sr-only" for="emailOtpCode" data-i18n="emailOtpCodeLabel">Verification code</label>
          <input id="emailOtpCode" class="auth-input auth-otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required data-i18n-placeholder="emailOtpCodePlaceholder" placeholder="6-digit code" />
          <p id="emailOtpCodeError" class="auth-field-error" role="alert" hidden></p>
          <button id="emailOtpVerifyBtn" class="auth-submit-button" type="submit" data-i18n="verifyEmailOtp">Verify and continue</button>
        </form>
        <button id="emailOtpBackBtn" class="auth-back-link" type="button" data-i18n="useDifferentEmail">Use a different email</button>
      </div>

      <div class="auth-secondary-action">
        <button id="visitorModeBtn" type="button" data-i18n="visitorMode">Continue in Visitor Mode</button>
      </div>

      <p id="authStatus" class="auth-status" role="status" aria-live="polite" hidden></p>
    </section>
  </main>

  <script src="../scripts/i18n.js?v=20260802-1"></script>
  <script src="../scripts/api.js?v=20260802-1"></script>
  <script src="../scripts/login.js?v=20260802-1"></script>
</body>
</html>
