<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="loginPageTitle">Log in or sign up</title>
  <link rel="stylesheet" href="../assets/styles.css?v=20260729-4" />
</head>
<body class="student-ui auth-page">
  <main class="auth-layout">
    <section class="auth-box" aria-labelledby="loginTitle">
      <a class="auth-brand" href="../index.html" data-i18n="homeBrand">ExPassway</a>

      <div class="auth-heading">
        <h1 id="loginTitle" data-i18n="loginHeroTitle">Log in or sign up</h1>
        <p data-i18n="loginHeroSubtitle">Practice smarter for the grades that open doors to leading universities.</p>
      </div>

      <div id="emailStep" class="auth-step">
        <button id="googleLoginBtn" class="auth-provider-button" type="button">
          <img src="../assets/google-g.svg" alt="" width="20" height="20" />
          <span data-i18n="continueWithGoogle">Continue with Google</span>
        </button>

        <div class="auth-divider"><span data-i18n="orLabel">OR</span></div>

        <form id="emailForm" novalidate>
          <label class="sr-only" for="userEmail" data-i18n="emailAddressLabel">Email address</label>
          <input
            id="userEmail"
            class="auth-input"
            type="email"
            inputmode="email"
            autocomplete="email"
            required
            data-i18n-placeholder="emailAddressPlaceholder"
            placeholder="Email address"
          />
          <p id="emailError" class="auth-field-error" role="alert" hidden></p>
          <button id="emailContinueBtn" class="auth-submit-button" type="submit" data-i18n="continueBtn">Continue</button>
        </form>
      </div>

      <div id="passwordStep" class="auth-step" hidden>
        <button class="auth-back-button" type="button" data-auth-back="email" data-i18n-aria-label="backToEmail" aria-label="Back to email">&#8592;</button>
        <p class="auth-account-email" data-auth-email></p>
        <form id="loginForm">
          <label class="sr-only" for="loginPassword" data-i18n="passwordLabel">Password</label>
          <input
            id="loginPassword"
            class="auth-input"
            type="password"
            autocomplete="current-password"
            required
            data-i18n-placeholder="passwordPlaceholder"
            placeholder="Password"
          />
          <button id="loginBtn" class="auth-submit-button" type="submit" data-i18n="loginBtn">Log in</button>
        </form>
        <p class="auth-secondary-action">
          <span data-i18n="newAccountPrompt">New to ExPassway?</span>
          <button id="showRegisterBtn" type="button" data-i18n="createAccountLink">Create an account</button>
        </p>
      </div>

      <div id="registerStep" class="auth-step" hidden>
        <button class="auth-back-button" type="button" data-auth-back="password" data-i18n-aria-label="backToLogin" aria-label="Back to login">&#8592;</button>
        <p class="auth-account-email" data-auth-email></p>
        <form id="registerForm">
          <label class="sr-only" for="userDisplayName" data-i18n="userNameLabel">Name</label>
          <input
            id="userDisplayName"
            class="auth-input"
            type="text"
            autocomplete="name"
            required
            data-i18n-placeholder="userDisplayNamePlaceholder"
            placeholder="Your name"
          />
          <label class="sr-only" for="registerPassword" data-i18n="passwordLabel">Password</label>
          <input
            id="registerPassword"
            class="auth-input"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
            data-i18n-placeholder="newAccountPasswordPlaceholder"
            placeholder="Create a password (6+ characters)"
          />
          <button id="registerBtn" class="auth-submit-button" type="submit" data-i18n="createAccountBtn">Create account</button>
        </form>
      </div>

      <p id="authStatus" class="auth-status" role="status" aria-live="polite" hidden></p>
    </section>
  </main>

  <script src="../scripts/i18n.js?v=20260729-4"></script>
  <script src="../scripts/api.js?v=20260729-3"></script>
  <script src="../scripts/login.js?v=20260729-3"></script>
</body>
</html>
