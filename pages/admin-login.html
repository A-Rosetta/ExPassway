<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="adminLoginPageTitle">Administrator login</title>
  <link rel="stylesheet" href="../assets/styles.css?v=20260729-4" />
</head>
<body class="student-ui auth-page">
  <main class="auth-layout">
    <section class="auth-box" aria-labelledby="adminLoginTitle">
      <a class="auth-brand" href="../index.html" data-i18n="homeBrand">ExPassway</a>
      <div class="auth-heading">
        <h1 id="adminLoginTitle" data-i18n="adminLoginHeroTitle">Administrator login</h1>
        <p data-i18n="adminLoginHeroSubtitle">Continue with the Google account assigned the ExPassway administrator role.</p>
      </div>
      <div class="auth-step">
        <button id="adminGoogleLoginBtn" class="auth-provider-button" type="button">
          <img src="../assets/google-g.svg" alt="" width="20" height="20" />
          <span data-i18n="adminContinueWithGoogle">Continue with Google as administrator</span>
        </button>
      </div>
      <p id="authStatus" class="auth-status" role="status" aria-live="polite" hidden></p>
    </section>
  </main>

  <script src="../scripts/i18n.js?v=20260731-1"></script>
  <script src="../scripts/api.js?v=20260731-1"></script>
  <script src="../scripts/admin-login.js?v=20260801-1"></script>
</body>
</html>
