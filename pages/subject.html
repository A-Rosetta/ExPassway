<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="subjectHubTitle">Subject hub</title>
  <script src="../scripts/theme-init.js?v=20260730-1"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/styles.css?v=20260822-1" />
  <link rel="stylesheet" href="../assets/site-design.css?v=20260806-2" />
  <link rel="stylesheet" href="../assets/subject.css?v=20261004-4" />
</head>
<body class="student-ui site-ui subject-hub-page">
  <header class="site-topbar subject-topbar">
    <div class="site-topbar__inner subject-topbar__inner">
      <a class="home-brand" href="../index.html"><span class="home-brand__mark" aria-hidden="true">E</span><span data-i18n="homeBrand">ExPassway</span></a>
      <nav class="site-header-controls subject-actions" aria-label="Subject navigation">
        <a class="btn-secondary" href="../index.html" data-i18n="backHome">Back to Home</a>
        <button id="subjectLanguage" class="btn-secondary" type="button" data-language-toggle>中文 / EN</button>
        <button id="themeToggle" class="btn-secondary" type="button" data-i18n-title="subjectTheme">Theme</button>
      </nav>
    </div>
  </header>
  <main class="subject-shell">
    <section class="subject-hero">
      <div>
        <p id="subjectEyebrow" class="home-eyebrow">CIE IGCSE</p>
        <h1 id="subjectTitle" data-i18n="subjectHubTitle">Subject hub</h1>
        <p id="subjectSubtitle" class="subject-subtitle"></p>
      </div>
      <div id="subjectReadiness" class="readiness-grid" aria-live="polite"></div>
    </section>

    <section id="subjectComponents" class="subject-components" aria-live="polite"></section>
    <div class="subject-toolbar">
      <a id="subjectBuilder" class="btn-primary" href="paper-builder.html?subject=9618" data-i18n="subjectBuilder">Build a paper</a>
    </div>

    <p id="subjectStatus" class="subject-status" role="status"></p>
    <nav class="subject-tabs" role="tablist" aria-label="Subject sections">
      <button class="subject-tab is-active" role="tab" aria-selected="true" data-view="syllabus" data-i18n="subjectSyllabus">Syllabus</button>
      <button class="subject-tab" role="tab" aria-selected="false" data-view="textbooks" data-i18n="subjectTextbooks">Textbooks</button>
      <button class="subject-tab" role="tab" aria-selected="false" data-view="papers" data-i18n="subjectPapers">Past papers</button>
    </nav>

    <section id="syllabusView" class="subject-view" role="tabpanel"></section>
    <section id="textbooksView" class="subject-view" role="tabpanel" hidden></section>
    <section id="papersView" class="subject-view" role="tabpanel" hidden></section>
  </main>
  <dialog id="questionDialog" class="subject-dialog">
    <article class="subject-dialog__content">
      <header><h2 id="questionDialogTitle"></h2><button id="closeQuestion" class="profile-dialog__close" type="button" aria-label="Close">×</button></header>
      <div id="questionDialogBody"></div>
    </article>
  </dialog>
  <script src="../scripts/i18n.js?v=20261004-4"></script>
  <script src="../scripts/site-ui.js?v=20260808-3"></script>
  <script src="../scripts/api.js?v=20261004-4"></script>
  <script src="../scripts/subject.bundle.js?v=20261004-4"></script>
</body>
</html>
