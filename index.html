<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="homePageTitle">ExPassway</title>
  <script src="scripts/theme-init.js?v=20260730-1"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" />
  <link rel="stylesheet" href="assets/styles.css?v=20260822-1" />
  <link rel="stylesheet" href="assets/site-design.css?v=20260806-2" />
</head>
<body class="student-ui site-ui home-dashboard">
  <header class="home-topbar">
    <div class="home-topbar__inner">
      <a class="home-brand" href="index.html" aria-label="ExPassway">
        <span class="home-brand__mark" aria-hidden="true">E</span>
        <span data-i18n="homeBrand">ExPassway</span>
      </a>
      <nav id="homeNav" class="home-nav-actions" aria-label="主页功能" data-i18n-aria-label="homeNavLabel">
        <button id="goNotebook" class="home-nav-button" type="button" data-i18n="homeNotebook">错题本</button>
        <button id="goAnalysis" class="home-nav-button" type="button" data-i18n="homeAnalysis">学习分析</button>
        <button id="goCommunity" class="home-nav-button" type="button" data-i18n="homeForum">论坛</button>
        <button id="openProfile" class="home-nav-button" type="button" data-i18n="homeProfile">个人资料</button>
        <button id="logoutHome" class="home-nav-button home-nav-button--logout" type="button" data-i18n="homeLogout">退出登录</button>
      </nav>
      <div class="home-header-controls">
        <!-- Left empty on purpose: site-ui.js fills it with the lamp, so the
             drawing lives in one place instead of being pasted per page. -->
        <button id="themeToggle" class="home-header-control home-theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式"></button>
        <button id="homeMenuToggle" class="home-header-control home-menu-toggle" type="button" aria-controls="homeNav" aria-expanded="false" aria-label="打开主页菜单" title="打开主页菜单">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <nav class="home-mobile-shortcuts" aria-label="主页快捷入口" data-i18n-aria-label="homeNavLabel">
    <a id="mobileNotebookShortcut" href="pages/notebook.html" data-i18n="homeNotebook">错题本</a>
    <a id="mobileForumShortcut" href="pages/community.html" data-i18n="homeForum">论坛</a>
  </nav>

  <main class="home-main">
    <section class="home-course-section" aria-labelledby="mySubjectsTitle">
      <div class="home-section-heading">
        <div>
          <p class="home-eyebrow" data-i18n="homeCourseEyebrow">CIE IGCSE 选择题</p>
          <h1 id="mySubjectsTitle" data-i18n="homeMySubjects">我的学科</h1>
        </div>
        <div class="home-heading-actions">
          <a id="openChapterPaperBuilder" class="btn-secondary" href="pages/paper-builder.html" data-i18n="paperBuilderOpen">按章节组卷</a>
          <button id="openPdfDownload" class="btn-primary home-pdf-download-button" type="button" data-i18n="homeDownloadPdfs" disabled>下载试卷 PDF</button>
          <button id="toggleMoreSubjects" class="btn-secondary home-more-subjects-button" type="button" data-i18n="homeMoreSubjects" aria-controls="moreSubjectPanel" aria-expanded="false">更多科目</button>
          <button id="goAdmin" class="btn-secondary home-admin-button" type="button" data-i18n="goAdmin" hidden>查看后台数据面板</button>
        </div>
      </div>

      <div id="subjectCourses" class="course-grid" aria-live="polite" aria-busy="true">
        <div class="course-card course-card--loading" aria-hidden="true"></div>
        <div class="course-card course-card--loading" aria-hidden="true"></div>
        <div class="course-card course-card--loading" aria-hidden="true"></div>
        <div class="course-card course-card--loading" aria-hidden="true"></div>
      </div>
      <p id="backendStatus" class="home-status" role="status" hidden></p>

      <div id="moreSubjectPanel" class="home-more-subjects" hidden>
        <div class="home-more-subjects__heading">
          <h2 data-i18n="homeMoreSubjectsTitle">更多科目</h2>
        </div>
        <div id="moreSubjectCourses" class="course-grid" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <dialog id="pdfDownloadDialog" class="profile-dialog pdf-download-dialog" aria-labelledby="pdfDownloadDialogTitle">
    <div class="profile-dialog__shell">
      <div class="profile-dialog__header">
        <h2 id="pdfDownloadDialogTitle" data-i18n="pdfDownloadDialogTitle">下载试卷 PDF</h2>
        <button id="closePdfDownload" class="profile-dialog__close" type="button" aria-label="关闭下载窗口" data-i18n-aria-label="closePdfDownload">×</button>
      </div>

      <div class="pdf-download-fields">
        <label><span data-i18n="pdfDownloadSubject">学科</span>
          <select id="pdfDownloadSubject"></select>
        </label>
        <label><span data-i18n="pdfDownloadPaper">试卷</span>
          <select id="pdfDownloadPaper" disabled></select>
        </label>
      </div>
      <p id="pdfDownloadStatus" class="pdf-download-status" role="status" hidden></p>
      <div class="pdf-download-actions">
        <a id="downloadQuestionPdf" class="pdf-download-action is-disabled" aria-disabled="true" data-i18n="downloadQuestionPdf">下载题目 PDF</a>
        <a id="downloadAnswerPdf" class="pdf-download-action pdf-download-action--answer is-disabled" aria-disabled="true" data-i18n="downloadAnswerPdf">下载答案 PDF</a>
      </div>
    </div>
  </dialog>

  <dialog id="profileDialog" class="profile-dialog" aria-labelledby="profileDialogTitle">
    <div class="profile-dialog__shell">
      <div class="profile-dialog__header">
        <div>
          <h2 id="profileDialogTitle" data-i18n="profileDialogTitle">个人资料与设置</h2>
        </div>
        <button id="closeProfile" class="profile-dialog__close" type="button" aria-label="关闭个人资料" data-i18n-aria-label="closeProfile">×</button>
      </div>

      <p id="accountStatus" class="tip"></p>
      <div class="grid-2">
        <label><span data-i18n="displayNameLabel">昵称</span>
          <input id="newDisplayName" type="text" data-i18n-placeholder="displayNamePlaceholder" placeholder="例如 Alice Zhang" />
        </label>
        <label><span data-i18n="profileGradeLabel">年级</span>
          <input id="newGrade" type="text" data-i18n-placeholder="gradePlaceholder" placeholder="例如 A2" />
        </label>
        <label><span data-i18n="targetScoreLabel">目标分</span>
          <input id="newTargetScore" type="number" min="0" max="100" data-i18n-placeholder="targetScorePlaceholder" placeholder="例如 90" />
        </label>
      </div>
      <div class="actions">
        <button id="updateProfileBtn" class="btn-primary" type="button" data-i18n="updateProfileBtn">保存资料修改</button>
      </div>

      <div class="profile-dialog__divider"></div>
      <section class="profile-pet-settings" aria-labelledby="profilePetTitle">
        <div>
          <h3 id="profilePetTitle" data-i18n="profilePetTitle">桌面宠物</h3>
          <p class="tip" data-i18n="profilePetDescription">宠物会提供网页使用建议，并在做题时帮你获取分步提示。</p>
        </div>
        <label class="setting-toggle">
          <input id="petEnabled" type="checkbox" checked />
          <span aria-hidden="true"></span>
          <strong data-i18n="profilePetEnabled">显示宠物</strong>
        </label>
        <label><span data-i18n="profilePetSkin">宠物皮肤</span>
          <select id="petSkin">
            <option value="codex-glass" data-i18n="profilePetCodexGlass">Codex 通透机器人</option>
          </select>
        </label>
        <p id="petSettingsStatus" class="tip" role="status"></p>
      </section>

      <section id="passkeySettings" aria-labelledby="passkeySettingsTitle">
        <div class="profile-dialog__divider"></div>
        <h3 id="passkeySettingsTitle">Passkeys</h3>
        <p class="tip">Manage the Passkeys that can sign in to this account and unlock Secure Chat.</p>
        <div id="passkeyList" class="profile-passkey-list" aria-live="polite"></div>
        <div class="actions"><button id="addPasskeyBtn" class="btn-secondary" type="button">Add Passkey</button></div>
        <p id="passkeySettingsStatus" class="tip" role="status"></p>
      </section>

      <section id="passwordSettings">
        <div class="profile-dialog__divider"></div>
        <div class="grid-2">
          <label><span data-i18n="oldPasswordLabel">旧密码</span>
            <input id="oldPassword" type="password" data-i18n-placeholder="oldPasswordPlaceholder" placeholder="请输入旧密码" />
          </label>
          <label><span data-i18n="newPasswordLabel">新密码</span>
            <input id="newPassword" type="password" data-i18n-placeholder="newPasswordPlaceholder" placeholder="至少 6 位" />
          </label>
        </div>
        <div class="actions">
          <button id="changePasswordBtn" class="btn-primary" type="button" data-i18n="changePasswordBtn">修改密码</button>
        </div>
      </section>
    </div>
  </dialog>

  <script src="scripts/i18n.js?v=20261004-3"></script>
  <script src="scripts/api.js?v=20261004-1"></script>
  <script src="scripts/pet.js?v=20260731-1"></script>
  <script src="scripts/app.js?v=20261004-3"></script>
  <script>
  (() => {
    const tokenKey="alevel.authToken", list=document.getElementById("passkeyList"), add=document.getElementById("addPasskeyBtn"), status=document.getElementById("passkeySettingsStatus");
    if(!list||!add)return;
    const b64=v=>{const n=String(v||"").replace(/-/g,"+").replace(/_/g,"/");const x=atob(n+"=".repeat((4-n.length%4)%4));return Uint8Array.from(x,c=>c.charCodeAt(0));};
    const out=v=>{const x=v instanceof Uint8Array?v:new Uint8Array(v);let s="";for(const c of x)s+=String.fromCharCode(c);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");};
    const pk=raw=>{const x={...(raw.publicKey||raw),challenge:b64((raw.publicKey||raw).challenge)};if(x.user?.id)x.user={...x.user,id:b64(x.user.id)};for(const k of ["allowCredentials","excludeCredentials"])if(Array.isArray(x[k]))x[k]=x[k].map(c=>({...c,id:b64(c.id)}));if(x.extensions?.prf?.eval?.first)x.extensions={...x.extensions,prf:{...x.extensions.prf,eval:{...x.extensions.prf.eval,first:b64(x.extensions.prf.eval.first)}}};return x;};
    const serialise=c=>{const r=c.response,e=c.getClientExtensionResults?.()||{};return{id:c.id,rawId:out(c.rawId),type:c.type,response:{clientDataJSON:out(r.clientDataJSON),attestationObject:out(r.attestationObject),transports:r.getTransports?.()||[]},clientExtensionResults:e.prf?{prf:{enabled:Boolean(e.prf.enabled||e.prf.results?.first)}}:{}};};
    async function api(path,init={}){const res=await fetch(path,{...init,headers:{"Content-Type":"application/json",Authorization:"Bearer "+(localStorage.getItem(tokenKey)||""),...(init.headers||{})}});const body=await res.json();if(!res.ok||body.ok===false)throw new Error(body.error?.message||"Request failed");return body.data;}
    async function load(){try{const rows=await api("/api/auth/me/passkeys");list.textContent="";const active=rows.filter(x=>!x.revoked);if(!active.length){list.textContent="No Passkeys registered.";return;}active.forEach(x=>{const row=document.createElement("div");row.className="profile-passkey-row";const text=document.createElement("span");text.textContent=(x.credentialId||"").slice(0,16)+"… · added "+new Date(x.createdAt).toLocaleString();const b=document.createElement("button");b.type="button";b.className="btn-secondary";b.textContent="Revoke";b.disabled=active.length<=1;b.onclick=async()=>{if(!confirm("Revoke this Passkey?"))return;try{await api("/api/auth/me/passkeys/"+encodeURIComponent(x.id),{method:"DELETE"});await load();}catch(e){status.textContent=e.message;}};row.append(text,b);list.append(row);});}catch(e){status.textContent=e.message;}}
    add.onclick=async()=>{try{add.disabled=true;status.textContent="Creating Passkey…";const raw=await api("/api/auth/me/passkeys/options",{method:"POST"});const c=await navigator.credentials.create({publicKey:pk(raw)});if(!c)throw new Error("Passkey creation was cancelled.");await api("/api/auth/me/passkeys/verify",{method:"POST",body:JSON.stringify({challenge:(raw.publicKey||raw).challenge,credential:serialise(c)})});status.textContent="Passkey added.";await load();}catch(e){status.textContent=e.message;}finally{add.disabled=false;}};
    document.getElementById("openProfile")?.addEventListener("click",()=>setTimeout(load,0));
  })();
  </script>

  <script src="scripts/site-ui.js?v=20260808-3"></script>
</body>
</html>
