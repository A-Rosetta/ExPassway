<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="homePageTitle">ExPassway</title>
  <script src="scripts/theme-init.js?v=20260730-1"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" />
  <link rel="stylesheet" href="assets/styles.css?v=20260729-2" />
  <link rel="stylesheet" href="assets/site-design.css?v=20260802-1" />
</head>
<body class="student-ui site-ui home-dashboard">
  <header class="home-topbar">
    <div class="home-topbar__inner">
      <a class="home-brand" href="index.html" aria-label="ExPassway">
        <span class="home-brand__mark" aria-hidden="true">E</span>
        <span data-i18n="homeBrand">ExPassway</span>
      </a>
      <nav id="homeNav" class="home-nav-actions" aria-label="主页功能" data-i18n-aria-label="homeNavLabel">
        <button id="goNotebook" class="home-nav-button" type="button" data-i18n="homeNotebook">错题本</button>
        <button id="goAnalysis" class="home-nav-button" type="button" data-i18n="homeAnalysis">学习分析</button>
        <button id="goCommunity" class="home-nav-button" type="button" data-i18n="homeForum">论坛</button>
        <button id="openProfile" class="home-nav-button" type="button" data-i18n="homeProfile">个人资料</button>
        <button id="logoutHome" class="home-nav-button home-nav-button--logout" type="button" data-i18n="homeLogout">退出登录</button>
      </nav>
      <div class="home-header-controls">
        <button id="themeToggle" class="home-header-control home-theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
          <svg class="home-theme-icon home-theme-icon--sun" aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
          <svg class="home-theme-icon home-theme-icon--moon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button id="homeMenuToggle" class="home-header-control home-menu-toggle" type="button" aria-controls="homeNav" aria-expanded="false" aria-label="打开主页菜单" title="打开主页菜单">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="home-main">
    <section class="home-course-section" aria-labelledby="mySubjectsTitle">
      <div class="home-section-heading">
        <div>
          <p class="home-eyebrow" data-i18n="homeCourseEyebrow">CIE IGCSE 选择题</p>
          <h1 id="mySubjectsTitle" data-i18n="homeMySubjects">我的学科</h1>
        </div>
        <div class="home-heading-actions">
          <button id="openPdfDownload" class="btn-primary home-pdf-download-button" type="button" data-i18n="homeDownloadPdfs" disabled>下载试卷 PDF</button>
          <button id="goAdmin" class="btn-secondary home-admin-button" type="button" data-i18n="goAdmin" hidden>查看后台数据面板</button>
        </div>
      </div>

      <div id="subjectCourses" class="course-grid" aria-live="polite" aria-busy="true">
        <div class="course-card course-card--loading" aria-hidden="true"></div>
        <div class="course-card course-card--loading" aria-hidden="true"></div>
        <div class="course-card course-card--loading" aria-hidden="true"></div>
        <div class="course-card course-card--loading" aria-hidden="true"></div>
      </div>
      <p id="backendStatus" class="home-status" role="status"></p>
    </section>

  </main>

  <dialog id="pdfDownloadDialog" class="profile-dialog pdf-download-dialog" aria-labelledby="pdfDownloadDialogTitle">
    <div class="profile-dialog__shell">
      <div class="profile-dialog__header">
        <h2 id="pdfDownloadDialogTitle" data-i18n="pdfDownloadDialogTitle">下载试卷 PDF</h2>
        <button id="closePdfDownload" class="profile-dialog__close" type="button" aria-label="关闭下载窗口" data-i18n-aria-label="closePdfDownload">×</button>
      </div>

      <div class="pdf-download-fields">
        <label><span data-i18n="pdfDownloadSubject">学科</span>
          <select id="pdfDownloadSubject"></select>
        </label>
        <label><span data-i18n="pdfDownloadPaper">试卷</span>
          <select id="pdfDownloadPaper" disabled></select>
        </label>
      </div>
      <p id="pdfDownloadStatus" class="pdf-download-status" role="status" hidden></p>
      <div class="pdf-download-actions">
        <a id="downloadQuestionPdf" class="pdf-download-action is-disabled" aria-disabled="true" data-i18n="downloadQuestionPdf">下载题目 PDF</a>
        <a id="downloadAnswerPdf" class="pdf-download-action pdf-download-action--answer is-disabled" aria-disabled="true" data-i18n="downloadAnswerPdf">下载答案 PDF</a>
      </div>
    </div>
  </dialog>

  <dialog id="profileDialog" class="profile-dialog" aria-labelledby="profileDialogTitle">
    <div class="profile-dialog__shell">
      <div class="profile-dialog__header">
        <div>
          <h2 id="profileDialogTitle" data-i18n="profileDialogTitle">个人资料与设置</h2>
        </div>
        <button id="closeProfile" class="profile-dialog__close" type="button" aria-label="关闭个人资料" data-i18n-aria-label="closeProfile">×</button>
      </div>

      <p id="accountStatus" class="tip"></p>
      <div class="grid-2">
        <label><span data-i18n="displayNameLabel">昵称</span>
          <input id="newDisplayName" type="text" data-i18n-placeholder="displayNamePlaceholder" placeholder="例如 Alice Zhang" />
        </label>
        <label><span data-i18n="profileGradeLabel">年级</span>
          <input id="newGrade" type="text" data-i18n-placeholder="gradePlaceholder" placeholder="例如 A2" />
        </label>
        <label><span data-i18n="targetScoreLabel">目标分</span>
          <input id="newTargetScore" type="number" min="0" max="100" data-i18n-placeholder="targetScorePlaceholder" placeholder="例如 90" />
        </label>
      </div>
      <div class="actions">
        <button id="updateProfileBtn" class="btn-primary" type="button" data-i18n="updateProfileBtn">保存资料修改</button>
      </div>

      <div class="profile-dialog__divider"></div>
      <section class="profile-pet-settings" aria-labelledby="profilePetTitle">
        <div>
          <h3 id="profilePetTitle" data-i18n="profilePetTitle">桌面宠物</h3>
          <p class="tip" data-i18n="profilePetDescription">宠物会提供网页使用建议，并在做题时帮你获取分步提示。</p>
        </div>
        <label class="setting-toggle">
          <input id="petEnabled" type="checkbox" checked />
          <span aria-hidden="true"></span>
          <strong data-i18n="profilePetEnabled">显示宠物</strong>
        </label>
        <label><span data-i18n="profilePetSkin">宠物皮肤</span>
          <select id="petSkin">
            <option value="codex-glass" data-i18n="profilePetCodexGlass">Codex 通透机器人</option>
          </select>
        </label>
        <p id="petSettingsStatus" class="tip" role="status"></p>
      </section>

      <section id="passwordSettings">
        <div class="profile-dialog__divider"></div>
        <div class="grid-2">
          <label><span data-i18n="oldPasswordLabel">旧密码</span>
            <input id="oldPassword" type="password" data-i18n-placeholder="oldPasswordPlaceholder" placeholder="请输入旧密码" />
          </label>
          <label><span data-i18n="newPasswordLabel">新密码</span>
            <input id="newPassword" type="password" data-i18n-placeholder="newPasswordPlaceholder" placeholder="至少 6 位" />
          </label>
        </div>
        <div class="actions">
          <button id="changePasswordBtn" class="btn-primary" type="button" data-i18n="changePasswordBtn">修改密码</button>
        </div>
      </section>
    </div>
  </dialog>

  <script src="scripts/i18n.js?v=20260802-9"></script>
  <script src="scripts/api.js?v=20260729-1"></script>
  <script src="scripts/pet.js?v=20260731-1"></script>
  <script src="scripts/app.js?v=20260802-9"></script>
  <script src="scripts/site-ui.js?v=20260730-1"></script>
</body>
</html>
