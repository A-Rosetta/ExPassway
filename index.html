<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="homePageTitle">A-Level 智能练习</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260718-2" />
</head>
<body>
  <div class="bg-shape"></div>
  <main class="container">
    <section class="card hero">
      <h1 id="heroTitle" data-i18n="homeHeroTitle">A-Level 智能练习</h1>
      <p id="heroSubtitle" data-i18n="homeHeroSubtitle">练习已发布的 CIE IGCSE 选择题真题，并查看错题诊断。</p>
    </section>

    <section class="card form-card">
      <h2 id="studyPathTitle" data-i18n="studyPathTitle">学习路径配置</h2>
      <div class="grid-2">
        <label><span id="gradeLabel" data-i18n="gradeLabel">年级</span>
          <select id="grade"></select>
        </label>
        <label><span id="boardLabel" data-i18n="boardLabel">考试局</span>
          <select id="board"></select>
        </label>
        <label><span id="subjectLabel" data-i18n="subjectLabel">科目</span>
          <select id="subject"></select>
        </label>
        <label><span id="paperLabel" data-i18n="paperLabel">模块/卷别</span>
          <select id="paper"></select>
        </label>
      </div>
      <div class="actions">
        <button id="goGenerate" class="btn-primary" data-i18n="goGenerate">生成模拟试卷练习题</button>
        <button id="goCommunity" class="btn-secondary" data-i18n="goCommunity">学习讨论</button>
        <button id="goAdmin" class="btn-secondary" data-i18n="goAdmin" hidden>查看后台数据面板</button>
      </div>
      <p id="backendStatus" class="tip"></p>
      <p id="homeNotice" class="tip" data-i18n="homeNotice">科目和试卷选项会根据已发布的 MCQ 自动更新。</p>
    </section>

    <section class="card panel">
      <h2 id="notebookTitle" data-i18n="notebookTitle">错题本概览</h2>
      <div id="notebookOverview"></div>
    </section>

    <section class="card panel">
      <details class="account-collapsible">
        <summary id="accountSummary" data-i18n="accountSummary">个人资料与设置</summary>
        <p id="accountStatus" class="tip"></p>
        <div class="actions">
          <button id="goLogin" class="btn-secondary" data-i18n="goLogin">去登录页面</button>
        </div>
        <div class="grid-2">
          <label><span id="displayNameLabel" data-i18n="displayNameLabel">昵称</span>
            <input id="newDisplayName" type="text" data-i18n-placeholder="displayNamePlaceholder" placeholder="例如 Alice Zhang" />
          </label>
          <label><span id="profileGradeLabel" data-i18n="profileGradeLabel">年级</span>
            <input id="newGrade" type="text" data-i18n-placeholder="gradePlaceholder" placeholder="例如 A2" />
          </label>
          <label><span id="targetScoreLabel" data-i18n="targetScoreLabel">目标分</span>
            <input id="newTargetScore" type="number" min="0" max="100" data-i18n-placeholder="targetScorePlaceholder" placeholder="例如 90" />
          </label>
          <label><span id="languageLabel" data-i18n="languageLabel">语言</span>
            <select id="preferredLanguage">
              <option value="zh-CN">中文</option>
              <option value="en">English</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <button id="updateProfileBtn" class="btn-primary" data-i18n="updateProfileBtn">保存资料修改</button>
        </div>

        <div class="grid-2" style="margin-top: 0.8rem;">
          <label><span id="oldPasswordLabel" data-i18n="oldPasswordLabel">旧密码</span>
            <input id="oldPassword" type="password" data-i18n-placeholder="oldPasswordPlaceholder" placeholder="请输入旧密码" />
          </label>
          <label><span id="newPasswordLabel" data-i18n="newPasswordLabel">新密码</span>
            <input id="newPassword" type="password" data-i18n-placeholder="newPasswordPlaceholder" placeholder="至少 6 位" />
          </label>
        </div>
        <div class="actions">
          <button id="changePasswordBtn" class="btn-primary" data-i18n="changePasswordBtn">修改密码</button>
        </div>
      </details>
    </section>
  </main>

  <script src="scripts/i18n.js?v=20260719-1"></script>
  <script src="scripts/data.js?v=20260718-1"></script>
  <script src="scripts/api.js?v=20260718-2"></script>
  <script src="scripts/app.js?v=20260718-2"></script>
</body>
</html>
